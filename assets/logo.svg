<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">HowToLiveBetterTH logo</title>
<desc id="desc">A shield inspired by Thailand's flag with a clear path and check mark, representing safe, practical living in Thailand.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111827"/>
    <stop offset="1" stop-color="#25345B"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".22"/>
  </filter>
</defs>
<rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
<g filter="url(#shadow)">
  <path d="M256 78 390 126v111c0 91-53 157-134 197-81-40-134-106-134-197V126z" fill="#fff"/>
  <clipPath id="shield">
    <path d="M256 78 390 126v111c0 91-53 157-134 197-81-40-134-106-134-197V126z"/>
  </clipPath>
  <g clip-path="url(#shield)">
    <rect x="112" y="78" width="288" height="62" fill="#A51931"/>
    <rect x="112" y="140" width="288" height="46" fill="#fff"/>
    <rect x="112" y="186" width="288" height="116" fill="#2D2A4A"/>
    <rect x="112" y="302" width="288" height="46" fill="#fff"/>
    <rect x="112" y="348" width="288" height="92" fill="#A51931"/>
  </g>
  <path d="M256 78 390 126v111c0 91-53 157-134 197-81-40-134-106-134-197V126z" fill="none" stroke="#fff" stroke-width="10"/>
</g>
<path d="M190 253 239 302 330 207" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="256" cy="256" r="4" fill="#fff"/>
</svg>